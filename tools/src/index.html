<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="등대 키친">
<meta name="theme-color" content="#8fd3d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<title>등대 키친</title>
<style>
/* Layout: full-screen game stage. HUD top, order cards, wooden merge tray, game-style bottom dock. Panels slide over as full-screen sheets. */
:root{
  --sky:#8fd3d6; --sea:#1f7a8c; --sea-deep:#134b5f; --foam:#e7f5f2; --sand:#f8e8c8;
  --coral:#ff7a59; --coral-deep:#d9542f; --sun:#ffc94d; --sun-deep:#d99a1b; --leaf:#41b96f; --leaf-deep:#238a4c;
  --ink:#2a2135; --paper:#fffaf0; --muted:#7a6d62; --wood:#c98b4f; --wood-dark:#8a5530; --wood-light:#e2b07a;
  --tile-a:#fdf3dc; --tile-b:#f5e3bd; --net:#9b7b52;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:15px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font-family:var(--display);color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
img.e{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.txte{display:grid;place-items:center;font-size:1.6em}
[hidden]{display:none!important}
.outline{color:#fff;text-shadow:0 2px 0 var(--o,#5b3a1e),2px 0 0 var(--o,#5b3a1e),-2px 0 0 var(--o,#5b3a1e),0 -2px 0 var(--o,#5b3a1e),2px 2px 0 var(--o,#5b3a1e),-2px 2px 0 var(--o,#5b3a1e),2px -2px 0 var(--o,#5b3a1e),-2px -2px 0 var(--o,#5b3a1e),0 4px 0 #0003}

/* Backdrop */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#7ccfe0 0%,#b9e8ea 38%,#e8f6ef 62%,#f6e4bf 100%)}
.backdrop .cloud{position:absolute;width:150px;opacity:.9;animation:drift linear infinite}
.backdrop .wave{position:absolute;left:-10%;right:-10%;height:60px;bottom:0;background:radial-gradient(40px 18px at 40px 0,transparent 98%,#ffffff55 100%) 0 0/80px 30px repeat-x;opacity:.6}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}

/* Stage */
#game{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;gap:10px;
  padding:calc(var(--sat) + 10px) max(14px,var(--sar)) calc(var(--sab) + 10px) max(14px,var(--sal))}
.hud{display:flex;align-items:center;gap:12px;flex:none;height:56px}
.me{display:flex;align-items:center;gap:6px;position:relative}
.me .face{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fff 0,#ffe0cc 70%);box-shadow:0 0 0 4px #fff,0 4px 0 4px #0002;padding:4px;flex:none}
.me .star{position:absolute;left:36px;bottom:-6px;width:34px;height:34px}
.me .star b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:14px;padding-top:3px}
.xp{width:110px;height:16px;border-radius:10px;background:#00000026;box-shadow:inset 0 2px 0 #0002;overflow:hidden;margin-left:8px;position:relative}
.xp i{display:block;height:100%;border-radius:10px;background:linear-gradient(180deg,#7ee0d8,#22a69a);transition:width .5s}
.xp span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:11px;color:#fff;text-shadow:0 1px 0 #0006}
.res{position:relative;display:flex;align-items:center;height:40px;border-radius:20px;background:linear-gradient(180deg,#5a3f2c,#3f2b1e);box-shadow:inset 0 2px 0 #0004,0 2px 0 #fff6;padding:0 16px 0 36px;min-width:110px;font-family:var(--display);font-size:20px;color:#fff;font-variant-numeric:tabular-nums}
.res .ico{position:absolute;left:-12px;top:50%;width:46px;height:46px;transform:translateY(-50%)}
.res small{font-size:11px;opacity:.8;margin-left:6px;font-family:var(--body)}
.hud .grow{flex:1}
.rbtn{width:48px;height:48px;border-radius:50%;background:linear-gradient(180deg,#fff,#e9dcc4);box-shadow:0 4px 0 #b9a67f,0 6px 10px #0002;padding:8px;flex:none;position:relative}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9a67f}

/* Orders */
.orders{display:flex;gap:12px;flex:none;overflow-x:auto;overflow-y:hidden;padding:20px 4px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.orders::-webkit-scrollbar{display:none}
.order{flex:none;width:200px;position:relative;background:linear-gradient(180deg,#fffdf6,#fbefd6);border-radius:20px;padding:12px 12px 10px 74px;
  box-shadow:0 0 0 3px #fff,0 6px 0 #e3cfa6,0 8px 16px #0002;display:flex;flex-direction:column;gap:8px;min-height:118px;transition:transform .2s}
.order .pt{position:absolute;left:-4px;top:-18px;width:76px;height:76px;border-radius:50%;padding:6px;box-shadow:0 0 0 3px #fff,0 4px 0 3px #0001}
.order .nm{position:absolute;left:8px;top:62px;width:60px;text-align:center;font-family:var(--display);font-size:13px;line-height:1.1}
.order.ready{box-shadow:0 0 0 3px var(--leaf),0 6px 0 var(--leaf-deep),0 0 22px #41b96f88;animation:readyBob 1.4s ease-in-out infinite}
@keyframes readyBob{50%{transform:translateY(-3px)}}
.reqs{display:flex;gap:6px;flex-wrap:wrap}
.req{position:relative;width:50px;height:50px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px #f0e2c4;padding:5px}
.req .ok{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;display:none}
.req.got{box-shadow:inset 0 0 0 2px var(--leaf);background:#effbf2}
.req.got .ok{display:block}
.ofoot{display:flex;align-items:center;gap:6px;margin-top:auto}
.ofoot .coin{width:22px;height:22px;flex:none}
.ofoot b{font-family:var(--display);font-weight:400;font-size:16px;color:var(--wood-dark)}
.ofoot .xpv{font-size:11px;color:var(--muted)}
.btn{font-family:var(--display);font-size:16px;color:#fff;padding:8px 16px;border-radius:14px;background:linear-gradient(180deg,#5fd18b,var(--leaf));box-shadow:0 4px 0 var(--leaf-deep),inset 0 2px 0 #fff6;text-shadow:0 1px 0 #0004;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-deep)}
.btn:disabled{background:linear-gradient(180deg,#d8ccb6,#c4b597);box-shadow:0 4px 0 #a99a7c;cursor:default;text-shadow:none}
.btn.coral{background:linear-gradient(180deg,#ff9c7f,var(--coral));box-shadow:0 4px 0 var(--coral-deep),inset 0 2px 0 #fff6}
.btn.sea{background:linear-gradient(180deg,#3aa6b8,var(--sea));box-shadow:0 4px 0 var(--sea-deep),inset 0 2px 0 #fff6}
.btn.gold{background:linear-gradient(180deg,#ffd877,var(--sun));box-shadow:0 4px 0 var(--sun-deep),inset 0 2px 0 #fff8;color:#5b3a1e;text-shadow:none}
.btn.plain{background:linear-gradient(180deg,#fff,#efe4cf);box-shadow:0 4px 0 #cdb991;color:var(--ink);text-shadow:none}
.ofoot .btn{margin-left:auto;padding:7px 12px;font-size:15px}

/* Board */
.mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.tray{position:relative;padding:14px;border-radius:28px;background:linear-gradient(180deg,var(--wood-light),var(--wood) 30%,var(--wood-dark));
  box-shadow:inset 0 3px 0 #ffffff66,inset 0 -4px 0 #00000033,0 10px 0 #6b3f22,0 18px 30px #0004}
.tray::before{content:'';position:absolute;inset:6px;border-radius:22px;border:2px dashed #ffffff40;pointer-events:none}
.board{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(9,1fr);border-radius:16px;overflow:hidden;touch-action:none;
  background:var(--tile-a);box-shadow:inset 0 4px 8px #0003;container-type:inline-size;position:relative}
.cell{position:relative;background:var(--tile-a);box-shadow:inset 0 0 0 1px #e8d5ae}
.cell.alt{background:var(--tile-b)}
.cell .ic{position:absolute;inset:11%;transition:transform .15s}
.cell.sel{z-index:2}
.cell.sel::before{content:'';position:absolute;inset:3px;border-radius:12px;border:3px solid #fff;box-shadow:0 0 0 3px var(--coral),0 0 16px var(--coral);animation:selPulse 1s ease-in-out infinite}
@keyframes selPulse{50%{box-shadow:0 0 0 3px var(--coral),0 0 4px var(--coral)}}
.cell.gen::after{content:'';position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#fff6c9 0,#ffe08a66 55%,transparent 70%);z-index:0}
.cell.gen .ic{z-index:1;animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.cell.tap .ic{animation:squash .25s ease-out}
@keyframes squash{40%{transform:scale(1.2,.85)}100%{transform:scale(1)}}
.cell.boxed .ic{filter:saturate(.6) brightness(.95);opacity:.85}
.cell.boxed::after{content:'';position:absolute;inset:4%;border-radius:12px;pointer-events:none;
  background:repeating-linear-gradient(45deg,transparent 0 calc(100cqw/7*.16),var(--net) calc(100cqw/7*.16) calc(100cqw/7*.19)),repeating-linear-gradient(-45deg,transparent 0 calc(100cqw/7*.16),var(--net) calc(100cqw/7*.16) calc(100cqw/7*.19));opacity:.7;
  box-shadow:inset 0 0 0 2px #8a6a43}
.cell .lv{position:absolute;left:5%;top:3%;font-family:var(--display);font-size:calc(100cqw / 7 * .2);color:#a07850;line-height:1}
.cell .ck{position:absolute;right:3%;bottom:3%;width:30%;height:30%;z-index:3;filter:drop-shadow(0 1px 1px #0004)}
.cell.want .ic{animation:want 1.6s ease-in-out infinite}
@keyframes want{50%{transform:translateY(-4%)}}
.cell.lift .ic{opacity:.25}
.cell.hov{background:#fff7c9}
.ptr{position:absolute;width:calc(100cqw/7*.8);height:calc(100cqw/7*.8);pointer-events:none;z-index:5;animation:point 1s ease-in-out infinite}
@keyframes point{50%{transform:translateY(-14%)}}

/* Dock */
.dock{flex:none;display:flex;align-items:flex-end;gap:12px}
.bigbtn{position:relative;width:88px;height:88px;border-radius:26px;flex:none;background:linear-gradient(180deg,#ffb38f,var(--coral));box-shadow:0 6px 0 var(--coral-deep),0 10px 18px #0003,inset 0 3px 0 #fff7;padding:10px 12px 22px}
.bigbtn span{position:absolute;left:0;right:0;bottom:6px;font-size:15px}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--coral-deep)}
.dot{position:absolute;right:-4px;top:-4px;min-width:22px;height:22px;border-radius:11px;background:#ff3b3b;border:3px solid #fff;color:#fff;font-family:var(--display);font-size:12px;display:grid;place-items:center;padding:0 4px;animation:dotp 1.2s ease-in-out infinite}
@keyframes dotp{50%{transform:scale(1.15)}}
.info{flex:1;min-width:0;height:72px;display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#fffdf6,#f6e8cc);border-radius:20px;padding:8px 12px;box-shadow:0 0 0 3px #fff,0 5px 0 #e0c99b}
.info .pic{width:54px;height:54px;flex:none;border-radius:14px;background:#fff;padding:5px;box-shadow:inset 0 0 0 2px #f0e2c4}
.info .tx{flex:1;min-width:0}
.info .tx b{display:block;font-family:var(--display);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .tx span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .chain{display:flex;gap:2px;margin-top:3px}
.info .chain i{width:22px;height:22px;opacity:.35}
.info .chain i.on{opacity:1}
.sqbtn{position:relative;width:64px;height:64px;border-radius:20px;flex:none;background:linear-gradient(180deg,#fff,#efe1c6);box-shadow:0 5px 0 #c9b288,0 8px 14px #0002;padding:9px 9px 18px}
.sqbtn span{position:absolute;left:0;right:0;bottom:4px;font-size:12px}
.sqbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #c9b288}
.sqbtn.hov{background:#ffe08a}

@media (orientation:landscape) and (min-width:900px){
  #game{display:grid;grid-template-columns:300px 1fr;grid-template-rows:56px 1fr auto;column-gap:18px}
  .hud{grid-column:1/3}
  .orders{grid-row:2/4;flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:22px 6px 12px 10px;gap:28px}
  .order{width:auto}
  .mid{grid-column:2;grid-row:2}
  .dock{grid-column:2;grid-row:3}
}
@media (max-width:500px){
  .bigbtn{width:70px;height:70px;padding:8px 10px 20px}
  .sqbtn{width:52px;height:52px;padding:7px 7px 16px}
  .info{height:62px}.info .chain{display:none}
  .xp{width:70px}
  .res small{display:none}.res{min-width:0;font-size:17px}
}

/* Sheets (full-screen panels) */
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:linear-gradient(180deg,#fdf3dc,#f3dfb8);animation:sheetIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
.sheet-h{flex:none;display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 12px) max(16px,var(--sar)) 12px max(16px,var(--sal));background:linear-gradient(180deg,var(--sea),#17677a);box-shadow:0 4px 0 #0f4b59}
.sheet-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;flex:1;--o:#0f4b59}
.sheet-h .ico{width:44px;height:44px;flex:none}
.xbtn{width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#ff8b6b,#e9573a);box-shadow:0 4px 0 #b23f25,inset 0 2px 0 #fff6;color:#fff;font-size:22px;flex:none}
.sheet-b{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,var(--sar)) calc(var(--sab) + 24px) max(16px,var(--sal))}

/* Decorate */
.deco{display:grid;grid-template-columns:1fr;gap:16px;max-width:1100px;margin:0 auto}
@media (orientation:landscape) and (min-width:900px){.deco{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--display);font-size:15px;padding:8px 14px;border-radius:999px;background:#fff;box-shadow:0 3px 0 #dccaa3;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--sea);color:#fff;box-shadow:0 3px 0 var(--sea-deep)}
.chip:disabled{opacity:.55}
.scene{position:relative;width:100%;aspect-ratio:4/3;border-radius:22px;overflow:hidden;container-type:inline-size;isolation:isolate;
  box-shadow:0 0 0 5px #fff,0 0 0 9px var(--wood),0 14px 30px #0004;background:#b8ad9c}
.scene > *{position:absolute}
.bwall{left:14%;right:14%;top:0;height:58%;background-color:var(--wall);
  background-image:linear-gradient(180deg,transparent 64%,#00000014 64% 65%,#ffffff1a 65% 66%,transparent 66%),repeating-linear-gradient(90deg,#ffffff22 0 2.2cqw,transparent 2.2cqw 4.4cqw)}
.bwall::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,#00000010 0 .3cqw,transparent .3cqw 8cqw),linear-gradient(180deg,#0000001f,#0000002e);border-top:1cqw solid #ffffff33}
.lwall,.rwall{inset:0;background-color:var(--wall);background-image:repeating-linear-gradient(90deg,#ffffff1a 0 2cqw,transparent 2cqw 4cqw)}
.lwall{clip-path:polygon(0 0,14% 0,14% 58%,0 82%);filter:brightness(.78)}
.rwall{clip-path:polygon(86% 0,100% 0,100% 82%,86% 58%);filter:brightness(.88)}
.dirty{background-image:radial-gradient(circle at 18% 30%,#3c28143a 0 6%,transparent 7%),radial-gradient(circle at 74% 64%,#3c281440 0 9%,transparent 10%),radial-gradient(circle at 46% 20%,#3c28142e 0 5%,transparent 6%),
  linear-gradient(115deg,transparent 47.6%,#2a1e1455 48% 48.5%,transparent 49%),linear-gradient(60deg,transparent 69.6%,#2a1e1444 70% 70.4%,transparent 71%)!important}
.floorclip{inset:0;clip-path:polygon(14% 58%,86% 58%,100% 82%,100% 100%,0 100%,0 82%)}
.floorclip.open{clip-path:polygon(0 58%,100% 58%,100% 100%,0 100%)}
.fpat{position:absolute;left:-60%;width:220%;top:58%;height:60%;transform-origin:50% 0;transform:perspective(60cqw) rotateX(60deg)}
.shade{inset:0;pointer-events:none;background:radial-gradient(ellipse at var(--lx,74%) var(--ly,28%),#fff3d044 0,transparent 55%),radial-gradient(ellipse at 50% 120%,transparent 50%,#0000002e 100%);z-index:150}
.night .shade{background:radial-gradient(ellipse at 50% 30%,#ffe9a833 0,transparent 50%),radial-gradient(ellipse at 50% 120%,transparent 40%,#0000004d 100%)}
.fl-dirty{background:radial-gradient(circle at 30% 20%,#00000026 0 5%,transparent 6%),radial-gradient(circle at 70% 30%,#00000026 0 7%,transparent 8%),repeating-linear-gradient(90deg,#7b6a58 0 6cqw,#5f5041 6cqw 6.5cqw)}
.fl-wood{background:repeating-linear-gradient(90deg,#d6a26a 0 6cqw,#bb8653 6cqw 6.4cqw)}
.fl-check{background:repeating-conic-gradient(#f7f1e6 0 25%,#2f8f9d 0 50%) 0 0/8cqw 8cqw}
.fl-terra{background:repeating-linear-gradient(90deg,transparent 0 8cqw,#9c4f31 8cqw 8.4cqw),repeating-linear-gradient(0deg,#d07d56 0 8cqw,#9c4f31 8cqw 8.4cqw)}
.fl-teak{background:repeating-linear-gradient(90deg,#c08550 0 5cqw,#97633a 5cqw 5.5cqw)}
.fl-whitedeck{background:repeating-linear-gradient(90deg,#f4ede2 0 5cqw,#cfc3b0 5cqw 5.5cqw)}
.fl-graydeck{background:repeating-linear-gradient(90deg,#a7b2ba 0 5cqw,#7f8a93 5cqw 5.5cqw)}
.fl-broken{background:repeating-linear-gradient(0deg,transparent 0 13cqw,#2e2620 13cqw 15cqw),repeating-linear-gradient(90deg,#7b6a58 0 5cqw,#3a2f27 5cqw 6cqw)}
.fl-walnut{background:repeating-linear-gradient(90deg,#74492b 0 6cqw,#563420 6cqw 6.4cqw)}
.fl-mono{background:repeating-conic-gradient(#f1efe9 0 25%,#2a2a33 0 50%) 0 0/8cqw 8cqw}
.fl-navy{background:repeating-linear-gradient(90deg,#3b5179 0 6cqw,#26385a 6cqw 6.4cqw)}
.sky{inset:0 0 42% 0;background:linear-gradient(180deg,#6cc3ea,#d9f2fa)}
.seab{left:0;right:0;top:40%;height:20%;background:linear-gradient(180deg,#3aa7c9,#1f7fa3)}
.seab::after{content:'';position:absolute;inset:0;background:radial-gradient(3cqw 1cqw at 3cqw 0,transparent 98%,#ffffff44 100%) 0 0/6cqw 3cqw repeat;animation:waves 6s linear infinite}
@keyframes waves{to{background-position:6cqw 0}}
.rail{left:0;right:0;top:56%;height:6cqw;background:repeating-linear-gradient(90deg,#8a5a36 0 1.2cqw,transparent 1.2cqw 7cqw);border-top:1.4cqw solid #8a5a36;z-index:40}
.porthole{transform:translate(-50%,-50%);border-radius:50%;aspect-ratio:1;border:1.8cqw solid var(--fc,#fff);background:linear-gradient(180deg,#a5dcf2 0 55%,#2a8fb0 55%);box-shadow:inset 0 0 0 .6cqw #0002,0 1cqw 0 #0003;overflow:hidden}
.porthole .sp{position:absolute;inset:0}
.porthole.night{background:linear-gradient(180deg,#14213d 0 58%,#1d3b5e 58%)}
.porthole.boarded{border-color:#6b5a48;background:repeating-linear-gradient(-12deg,#8b6b4b 0 5cqw,#5d4632 5cqw 5.6cqw)}
.counter{border-radius:1cqw 1cqw .4cqw .4cqw;background:linear-gradient(180deg,#ffffff55 0 13%,#0000001a 13% 15%,transparent 15%),repeating-linear-gradient(90deg,transparent 0 9cqw,#00000014 9cqw 9.4cqw),var(--c);box-shadow:0 1.4cqw 0 #0003,inset 0 -1cqw 0 #0002}
.counter .top{position:absolute;left:0;right:0;top:-6cqw;height:7cqw;display:flex;justify-content:space-around}
.counter .top i{width:7cqw;height:7cqw;display:block}
.tset{transform:translate(-50%,-62%);display:flex;align-items:flex-end;justify-content:center}
.tset .ch{width:9cqw;height:9cqw;filter:hue-rotate(var(--h,0deg)) drop-shadow(0 .6cqw .4cqw #0004)}
.tset .ch.r{transform:scaleX(-1)}
.tset .tb{position:relative;width:16cqw;height:10cqw;margin:0 -1.5cqw}

function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function freshState(){
  const cells=Array(N).fill(null),rnd=mulberry(7);
  for(let i=0;i<21;i++){if(i>=14&&i%2===1)continue;const r=rnd();cells[i]=r<.08?{c:'coin',l:0,box:1}:{c:r<.54?'bake':'drink',l:Math.floor(rnd()*3),box:1}}
  cells[37]={g:'bake'};cells[39]={g:'drink'};
  cells[44]={c:'bake',l:0};cells[45]={c:'bake',l:0};cells[46]={c:'drink',l:0};cells[47]={c:'drink',l:0};
  const s={v:1,cells,bag:Array(BAG).fill(null),coins:5,xp:0,level:1,orders:[],oid:1,hearts:{},deco:{},area:0,seen:[],
    season:{pts:0,claimed:{}},gens:['bake','drink'],pendingGens:[],total:0,introDone:false,tut:0,sfx:true,music:true};
  const mk=(who,items)=>{const o={id:s.oid++,who,items};priceOrder(o);return o};
  s.orders=[mk('captain',[{c:'bake',l:1}]),mk('rumi',[{c:'drink',l:1}]),mk('sol',[{c:'bake',l:0}]),mk('bella',[{c:'bake',l:0},{c:'drink',l:0}])];

let actx=null,master=null,musicGain=null,musicTimer=0,nextNote=0,step=0;
function audio(){
  if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A();master=actx.createGain();master.gain.value=.9;master.connect(actx.destination);musicGain=actx.createGain();musicGain.gain.value=.5;musicGain.connect(master)}
  if(actx.state==='suspended')actx.resume();
  return actx;
}
function tone(f,d,type,vol,slide,delay,dest){
  const c=audio();if(!c)return;const t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05);
}
const SFX={
  pop(){if(!S.sfx)return;tone(520,.14,'sine',.28,1100);tone(1560,.08,'triangle',.08,null,.06)},
  produce(){if(!S.sfx)return;tone(700,.09,'triangle',.18,980)},
  coin(){if(!S.sfx)return;tone(1320,.07,'square',.05);tone(1760,.14,'square',.05,null,.07)},
  tap(){if(!S.sfx)return;tone(420,.05,'sine',.12)},
  bad(){if(!S.sfx)return;tone(220,.14,'sawtooth',.05,160)},
  level(){if(!S.sfx)return;[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.18,null,i*.09))},
  chime(){if(!S.sfx)return;[784,988,1175,1568].forEach((f,i)=>tone(f,.4,'sine',.16,null,i*.08))},
  done(){if(!S.sfx)return;[659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.16,null,i*.07))}
};
const CHORDS=[[261.6,329.6,392],[246.9,293.7,392],[220,261.6,329.6],[174.6,220,261.6]];
const MEL=[784,0,659,0,698,659,587,0, 587,0,523,587,659,0,0,0, 523,0,587,659,523,0,440,0, 440,523,587,0,523,0,0,0];
function musicTick(){
  if(!actx||!S.music)return;const spb=.3;
  while(nextNote<actx.currentTime+.6){
    const bar=Math.floor(step/8)%4,ch=CHORDS[bar],s8=step%8;
    const at=nextNote-actx.currentTime;
    if(at>=0){
      tone(ch[[0,1,2,1,0,1,2,1][s8]]*2,.28,'triangle',.05,null,at,musicGain);
      if(s8===0||s8===4)tone(ch[0]/2,.5,'sine',.09,null,at,musicGain);
      const m=MEL[step%32];if(m)tone(m,.32,'sine',.045,null,at,musicGain);
    }
    nextNote+=spb;step++;
  }
}
function startMusic(){const c=audio();if(!c)return;if(!musicTimer){nextNote=c.currentTime+.1;musicTimer=setInterval(musicTick,150)}}

/* ================= ORDERS ================= */
function priceOrder(o){o.coins=o.items.reduce((a,it)=>a+COINV[it.l],2);o.xp=o.items.reduce((a,it)=>a+(it.l+1)*2,0)}
function customers(){return Object.keys(CUSTOMER_UNLOCK).filter(k=>!CUSTOMER_UNLOCK[k]||taskDone(CUSTOMER_UNLOCK[k]))}
function genOrder(){
  const pool=customers(),busy=new Set(S.orders.map(o=>o.who)),free=pool.filter(w=>!busy.has(w)),src=free.length?free:pool;
  const who=src[Math.floor(Math.random()*src.length)],L=S.level;let n=1;
  if(L>=3)n=Math.random()<.5?2:1;
  if(L>=7)n=Math.random()<.15?3:(Math.random()<.55?2:1);
  const items=[];
  for(let k=0;k<n;k++){
    const c=S.gens[Math.floor(Math.random()*S.gens.length)],ml=Math.min(maxL(c),1+Math.floor(L*.7));
    let l=Math.floor(Math.pow(Math.random(),.75)*(ml+1));if(L>=3)l=Math.max(l,1);if(n>1)l=Math.max(0,l-1);
    items.push({c,l:Math.min(l,ml)});
  }
  const o={id:S.oid++,who,items};priceOrder(o);return o;
}
function boardCounts(){const m={};S.cells.forEach(it=>{if(it&&!it.box&&!it.g){const k=keyOf(it);m[k]=(m[k]||0)+1}});return m}
function orderStatus(o,counts){const used={};return o.items.map(it=>{const k=keyOf(it);used[k]=(used[k]||0)+1;return(counts[k]||0)>=used[k]})}
function neededKeys(){const s=new Set();S.orders.forEach(o=>o.items.forEach(it=>s.add(keyOf(it))));return s}
function completeOrder(id,btn){
  const o=S.orders.find(x=>x.id===id);if(!o)return;
  if(!orderStatus(o,boardCounts()).every(Boolean))return;
  o.items.forEach(it=>{const i=S.cells.findIndex(x=>x&&!x.box&&!x.g&&x.c===it.c&&x.l===it.l);if(i>=0){
    const cell=boardEl.children[i];if(cell){const[x,y]=rectC(cell);sparkle(x,y,6,20)}S.cells[i]=null}});
  SFX.done();
  const card=btn.closest('.order');flyCoins(card,Math.min(8,3+Math.floor(o.coins/10)),()=>{renderHUD()});
  const[bx,by]=rectC(btn);floatText('+'+o.coins,bx,by);
  S.coins+=o.coins;S.season.pts+=o.xp;S.hearts[o.who]=(S.hearts[o.who]||0)+1;S.total++;
  if(S.hearts[o.who]%5===0)toast(`${CHARS[o.who].name}와(과) 더 친해졌어요 💗`);
  if(Math.random()<.22){const j=emptyNear(Math.floor(N/2));if(j>=0){S.cells[j]={c:'coin',l:0};fx[j]={pop:1}}}
  S.orders=S.orders.filter(x=>x.id!==id);
  if(S.tut<3)S.tut=3;
  addXP(o.xp);
  while(S.orders.length<4)S.orders.push(genOrder());
  commit(true);
}

/* ================= PROGRESSION ================= */
function addXP(n){S.xp+=n;while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;onLevelUp()}}
const lvQueue=[];
function onLevelUp(){
  const bonus=10*S.level;S.coins+=bonus;lvQueue.push({lv:S.level,bonus});
  if(S.level>=3&&!S.gens.includes('cook')&&!S.pendingGens.includes('cook')){S.pendingGens.push('cook');lvQueue[lvQueue.length-1].unlock='cook'}
  if(S.level>=5&&!S.gens.includes('sea')&&!S.pendingGens.includes('sea')){S.pendingGens.push('sea');lvQueue[lvQueue.length-1].unlock='sea'}
  setTimeout(showLevelUp,900);
}
function showLevelUp(){
  if(document.querySelector('.lvup')||!lvQueue.length)return;
  if(!$('#dlg').hidden){setTimeout(showLevelUp,600);return}
  const q=lvQueue.shift();SFX.level();confetti();
  const el=document.createElement('div');el.className='lvup';
  el.innerHTML=`<div class="card"><div class="big">${I('⭐')}<b class="outline">${q.lv}</b></div><h2 class="outline">레벨 업!</h2>
    <p class="outline">보상 🪙 ${q.bonus}${q.unlock?` · 새 생산기 "${CH[q.unlock].gen[1]}"`:''}</p><button class="btn gold" style="margin-top:14px;font-size:20px;padding:10px 30px">좋아요!</button></div>`;
  document.body.appendChild(el);

}
function placePendingGens(){
  S.pendingGens=S.pendingGens.filter(g=>{const j=emptyNear(Math.floor(N/2)+COLS);if(j<0)return true;S.cells[j]={g};fx[j]={pop:1};if(!S.gens.includes(g))S.gens.push(g);return false});
}

/* ================= BOARD ================= */
const boardEl=$('#board');let sel=-1;const fx={};
function emptyNear(i){const r0=Math.floor(i/COLS),c0=i%COLS;let best=-1,bd=1e9;for(let j=0;j<N;j++){if(S.cells[j])continue;const d=Math.abs(Math.floor(j/COLS)-r0)+Math.abs(j%COLS-c0)+j/1000;if(d<bd){bd=d;best=j}}return best}
function unboxAround(j){const r=Math.floor(j/COLS),c=j%COLS;[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([rr,cc])=>{if(rr<0||cc<0||rr>=ROWS||cc>=COLS)return;const k=rr*COLS+cc,it=S.cells[k];if(it&&it.box){delete it.box;fx[k]={pop:1}}})}
function produce(i){
  const g=S.cells[i].g,j=emptyNear(i);
  if(j<0){SFX.bad();toast('보드가 가득 찼어요. 합성하거나 가방에 넣어 주세요');return}
  S.cells[j]={c:g,l:Math.random()<.18?1:0};fx[j]={from:i};fx[i]={tap:1};SFX.produce();
  if(S.tut===0)S.tut=1;
  commit();
}
function drop(i,j){
  if(i===j)return;const a=S.cells[i],b=S.cells[j];
  if(!b){S.cells[j]=a;S.cells[i]=null;sel=j;SFX.tap()}
  else if(!a.g&&!b.g&&a.c===b.c&&a.l===b.l){
    if(a.l>=maxL(a.c)){SFX.bad();toast('이미 최고 단계예요!');return}
    S.cells[j]={c:a.c,l:a.l+1};S.cells[i]=null;unboxAround(j);fx[j]={pop:1,merge:1};sel=j;SFX.pop();
    if(S.tut<2)S.tut=2;
    if(a.l+1===maxL(a.c))toast(`최고 단계 "${iname(S.cells[j])}" 완성!`);
  }
  else if(b.box){SFX.bad();toast('그물에 걸린 아이템은 옆 칸에서 합성하면 풀려요');return}
  else{S.cells[j]=a;S.cells[i]=b;sel=j;SFX.tap()}
  commit();
}
function tapCell(i){
  const it=S.cells[i];
  if(!it){sel=-1;renderInfo();renderBoard();return}
  if(it.box){SFX.bad();toast('옆 칸에서 합성하면 그물이 풀려요');sel=i;renderInfo();renderBoard();return}
  if(it.g){sel=i;produce(i);return}
  sel=i;SFX.tap();renderInfo();renderBoard();

boardEl.addEventListener('pointerdown',e=>{

    const t=document.elementFromPoint(e.clientX,e.clientY),h=t&&(t.closest('#board .cell')||t.closest('#btnBag'));

function endDrag(e,cancel){

function runScript(id){
  let k=0,full=false;const lines=SCR[id],dl=$('#dlg');dl.hidden=false;

    const p=dl.querySelector('.tx');let n=0;const chars=[...text];

  if(sheet==='season'){
    const b=e.target.closest('[data-claim],#claimAll');if(!b)return;
    if(b.id==='claimAll'){const c0=S.coins;let items=0;const r=Math.min(TIERS,Math.floor(S.season.pts/PER));for(let t=1;t<=r;t++)['f','v'].forEach(l=>{if(!S.season.claimed[t+l]){const x=claim(t+l,true);if(x&&x.item)items++}});
      toast(`보상 수령: 🪙 +${S.coins-c0}${items?` · 아이템 ${items}개`:''}`);flyCoins(b,6)}
    else{claim(b.dataset.claim);const[x,y]=rectC(b);sparkle(x,y,8,22)}
    SFX.coin();commit();
  }
});
function doTask(t,btn){
  if(!t||taskDone(t.id))return;
  if(S.coins<t.cost){SFX.bad();toast(`코인이 ${t.cost-S.coins}개 부족해요`);return}
  S.coins-=t.cost;S.deco[t.id]=0;SFX.chime();commit();pickStyle(t,true);
}
function swatch(t,s){
  if(t.type==='wall')return `<span class="sw" style="background:${s.v}"></span>`;
  if(t.type==='floor')return `<span class="sw fl-${s.v}"></span>`;
  if(t.type==='window')return `<span class="sw" style="background:#e9f6fb"><span style="width:52px;height:52px;border-radius:50%;border:7px solid ${s.v};background:linear-gradient(#a5dcf2 55%,#2a8fb0 55%);box-shadow:0 0 0 1px #0002"></span></span>`;
  if(t.type==='counter'||t.type==='sign')return `<span class="sw" style="background:${s.v};color:#fff;font-family:var(--display);font-size:14px">${t.type==='sign'?'등대 키친':I(t.deco[0],'','width:60%;height:60%')}</span>`;
  if(t.type==='table')return `<span class="sw" style="background:${s.v}">${I('🪑','',`filter:hue-rotate(${s.h}deg)`)}</span>`;
  if(t.type==='frame')return `<span class="sw" style="background:#fdf6e6;border:7px solid ${s.v}">${I(s.g)}</span>`;
  if(t.type==='lights')return `<span class="sw" style="background:#2d3e63;display:flex;gap:5px;align-items:center;justify-content:center">${[0,1,2].map(i=>{const c=s.v==='rainbow'?RB[i]:s.v;return `<i style="width:12px;height:15px;border-radius:50%;background:${c};box-shadow:0 0 10px ${c}"></i>`}).join('')}</span>`;
  return `<span class="sw" style="background:#f1f7f6">${I(s.g,'',`filter:hue-rotate(${s.h||0}deg)`)}</span>`;
}
function pickStyle(t,first){
  const cur=S.deco[t.id]||0;
  showModal(`<h2>${esc(t.name)}</h2><p class="sub">${first?'어떤 스타일로 할까요? 나중에 언제든 바꿀 수 있어요.':'다른 스타일로 바꿔 볼까요? 무료예요.'}</p>
    <div class="opts">${t.styles.map((s,k)=>`<button class="opt" data-k="${k}" aria-pressed="${k===cur}">${swatch(t,s)}${esc(s.n)}</button>`).join('')}</div>`,
  box=>box.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b)return;S.deco[t.id]=+b.dataset.k;closeModal();SFX.pop();commit();
    const sc=$('#scene');if(sc){const r=sc.getBoundingClientRect();sparkle(r.left+r.width*t.p[0]/100,r.top+r.height*t.p[1]/100,14,34)}
    if(first)setTimeout(()=>afterTask(t),500)}),!first);
}
function afterTask(t){
  queue(t.id);const a=AREAS[t.area];
  if(a.tasks.every(x=>taskDone(x.id))&&S.area===t.area){
    S.area++;S.coins+=50;queue(AREA_END[a.id]);toast(`${a.ch} 완성! 보너스 🪙 50`);confetti();
    viewArea=Math.min(S.area,AREAS.length-1);commit();
  }
}

/* ================= FRIENDS ================= */
function friendsHTML(){
  return `<p class="sub" style="max-width:1100px;margin:0 auto 14px">주문을 완료하면 그 주민의 호감도가 올라가요. 하트 5개마다 한 단계씩 친해져요.</p><div class="friends">${Object.keys(CHARS).map(id=>{
    const c=CHARS[id],h=S.hearts[id]||0,lock=id!=='hana'&&CUSTOMER_UNLOCK[id]&&!taskDone(CUSTOMER_UNLOCK[id]);
    const stat=id==='hana'?`<div class="hearts"><i class="hi">${I('⭐')}</i>주문 완료 ${S.total}회 · 레벨 ${S.level}</div>`:`<div class="hearts"><i class="hi">${I('💗')}</i>${Math.floor(h/5)}단계<span class="prog"><i style="width:${(h%5)/5*100}%"></i></span>${h%5}/5</div>`;
    return `<div class="friend${lock?' locked':''}">${portrait(id)}<div style="min-width:0;flex:1"><h3>${lock?'???':c.name}</h3><div class="role">${lock?'이야기를 진행하면 만날 수 있어요':c.role}</div>${lock?'':`<p>${c.bio}</p>${stat}`}</div></div>`;
  }).join('')}</div>`;
}

/* ================= SEASON ================= */
const TIERS=20,PER=25;
function seasonReward(t,lane){
  if(lane==='f')return t%4===0?{item:{c:'coin',l:1}}:{coins:15+t*5};
  if(t%5===0)return{item:{c:'coin',l:2}};
  if(t%2===0)return{coins:40+t*8};
  const ch=t<8?['bake','drink']:['bake','drink','cook','sea'];return{item:{c:ch[t%ch.length],l:Math.min(2+Math.floor(t/4),6)}};
}
function seasonClaimable(){let n=0;const r=Math.min(TIERS,Math.floor(S.season.pts/PER));for(let t=1;t<=r;t++)['f','v'].forEach(l=>{if(!S.season.claimed[t+l])n++});return n}
function claim(key,quiet){
  if(S.season.claimed[key])return null;const t=parseInt(key),lane=key.slice(-1);if(t>Math.floor(S.season.pts/PER))return null;
  const r=seasonReward(t,lane);S.season.claimed[key]=1;
  if(r.coins){S.coins+=r.coins;if(!quiet)toast(`🪙 +${r.coins}`)}else giveItem({...r.item},quiet);return r;
}
function seasonHTML(){
  const reached=Math.floor(S.season.pts/PER),pct=reached>=TIERS?100:(S.season.pts%PER)/PER*100,cl=seasonClaimable();
  let rows='';
  for(let t=1;t<=TIERS;t++){
    const ok=t<=reached,cell=lane=>{const r=seasonReward(t,lane),got=S.season.claimed[t+lane];
      const g=r.coins?'🪙':glyph(r.item),n=r.coins?`코인 ${r.coins}`:iname(r.item);
      return `<div class="rw${lane==='v'?' vip':''}${got?' got':''}"><i class="ri">${I(g)}</i><span class="rt"><b>${esc(n)}</b>${lane==='v'?'VIP 보상':'무료 보상'}</span>${got?I('✅','','width:28px;height:28px'):`<button class="btn${lane==='v'?' gold':''}" data-claim="${t}${lane}" ${ok?'':'disabled'}>받기</button>`}</div>`};
    rows+=`<div class="trow${ok?' on':''}">${cell('f')}<div class="tnum">${t}</div>${cell('v')}</div>`;
  }
  return `<div class="shead"><div class="tt"><i>${I('🎟️')}</i><div><h3 class="outline">은빛 파도 시즌</h3><span class="free">🔓 VIP 시즌 패스 포함, 모든 보상 무료</span></div></div>
     <div style="display:flex;justify-content:space-between;font-family:var(--display);font-size:16px;color:#5b2a10"><span>${Math.min(reached,TIERS)}/${TIERS} 단계</span><span>시즌 점수 ${S.season.pts}</span></div>
     <div class="prog"><i style="width:${pct}%"></i></div>
     <span style="font-size:13px;color:#5b2a10">주문을 완료할 때 얻는 XP만큼 시즌 점수가 쌓여요.${reached<TIERS?` 다음 단계까지 ${PER-S.season.pts%PER}점.`:''}</span>
     ${cl?`<button class="btn" id="claimAll" style="align-self:flex-start;font-size:17px">받을 수 있는 보상 모두 받기 (${cl})</button>`:''}</div>
   <div class="tiers"><div class="trow thead"><span>무료</span><span>단계</span><span>VIP · 무료 개방</span></div>${rows}</div>`;
}

/* ================= SETTINGS / HELP ================= */

  <li><b>생산기</b>(빵 바구니, 티 포트, 화덕, 어선)를 누르면 재료가 바로 나와요. 에너지와 대기 시간은 없어요.</li>
  <li>같은 아이템 두 개를 끌어다 겹치면 다음 단계로 <b>합성</b>돼요.</li>
  <li>그물에 걸린 아이템은 <b>바로 옆 칸에서 합성</b>하면 풀려요.</li>
  <li>주문에 필요한 아이템이 보드에 있으면 초록 체크가 붙어요. <b>완료</b>를 누르면 코인과 경험치를 받아요.</li>
  <li><b>꾸미기</b>에서 코인으로 식당을 꾸미면 이야기가 이어져요. 3장까지 있어요.</li>
  <li>레벨 3에 화덕, 레벨 5에 어선이 열려요.</li>
  <li><b>시즌</b>의 VIP 보상까지 모두 무료로 받을 수 있어요.</li></ul>`)};
$('#btnSet').onclick=()=>{SFX.tap();showModal(`<h2>설정</h2>
  <div class="toggle">효과음<button class="sw2" id="tgS" aria-pressed="${S.sfx}" aria-label="효과음"></button></div>
  <div class="toggle">배경 음악<button class="sw2" id="tgM" aria-pressed="${S.music}" aria-label="배경 음악"></button></div>
  <div class="row"><button class="btn sea" id="rePro">프롤로그 다시 보기</button><button class="btn plain" id="reset" data-step="0">처음부터 다시 하기</button></div>
  <p class="sub" style="margin-top:12px">진행 상황은 이 기기에 자동 저장돼요.</p>`,
  box=>{
    box.querySelector('#tgS').onclick=e=>{S.sfx=!S.sfx;e.currentTarget.setAttribute('aria-pressed',S.sfx);save();SFX.tap()};
    box.querySelector('#tgM').onclick=e=>{S.music=!S.music;e.currentTarget.setAttribute('aria-pressed',S.music);if(S.music){startMusic();musicGain.gain.value=.5}else if(musicGain)musicGain.gain.value=0;save()};
    box.querySelector('#rePro').onclick=()=>{closeModal();queue('prologue')};
    box.querySelector('#reset').onclick=e=>{const b=e.currentTarget;if(b.dataset.step==='0'){b.dataset.step='1';b.textContent='정말 초기화할까요? 한 번 더 누르세요';b.className='btn coral';return}
      S=freshState();S.introDone=true;sel=-1;viewArea=null;closeModal();commit();queue('prologue')};
  })};

/* ================= COMMIT / BOOT ================= */
function commit(skipOrdersAnim){
  placePendingGens();if(sel>=0&&!S.cells[sel])sel=-1;
  save();renderHUD();renderOrders();renderBoard();renderInfo();if(sheet)renderSheet();
}
function setStatic(){
  $('#meFace').innerHTML=I(CHARS.hana.e);$('#coinIco').innerHTML=I('🪙');$('#enIco').innerHTML=I('⚡');
  $('#btnHelp').innerHTML=I('❓');$('#btnSet').innerHTML=I('⚙️');
  $('#btnDeco').insertAdjacentHTML('afterbegin',I('🏠'));
  $('#btnBag').insertAdjacentHTML('afterbegin',I('🎒'));$('#btnSeason').insertAdjacentHTML('afterbegin',I('🎟️'));$('#btnFriends').insertAdjacentHTML('afterbegin',I('💗'));
  $('#titleItems').innerHTML=['🥐','🧋','🍣','🧁'].map(e=>`<i>${I(e)}</i>`).join('');
  const bd=document.querySelector('.backdrop');
  [[8,40],[30,90],[60,20]].forEach(([top,dur],k)=>{const c=document.createElement('div');c.className='cloud';c.style.top=top+'%';c.style.animationDuration=dur+'s';c.style.animationDelay=(-k*20)+'s';c.innerHTML=I('☁️');bd.appendChild(c)});
}
async function boot(){
  setStatic();
  S=await load();
  try{new ResizeObserver(fitBoard).observe($('#mid'))}catch(e){addEventListener('resize',fitBoard)}
  commit();requestAnimationFrame(fitBoard);
  $('#title').onclick=()=>{
    audio();if(S.music)startMusic();SFX.chime();
    const t=$('#title');t.animate([{opacity:1},{opacity:0,transform:'scale(1.06)'}],{duration:450,easing:'ease-in'}).onfinish=()=>{t.remove();fitBoard();
      if(!S.introDone){S.introDone=true;save();queue('prologue')}};
  };
  document.addEventListener('visibilitychange',()=>{if(!actx)return;if(document.hidden)actx.suspend();else if(S.music||S.sfx)actx.resume()});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
boot();
})();
</script>
